[package]
name = "devassist-ai"
version = "0.1.0"
description = "DevAssist AI - 基于 Rust + Tauri 的 AI 辅助开发桌面工具"
edition = "2021"
authors = ["DevAssist AI Contributors"]

[lib]
name = "devassist_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
